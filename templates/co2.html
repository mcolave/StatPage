{% extends "base.html" %}

{% block title %}CO2 Emissions - StatHub{% endblock %}

{% block content %}
<div class="hero">
    <h1>CO2 Emissions</h1>
    <p>Countries by metric tons per capita.</p>
</div>

<div class="card">
    <div id="chart" class="chart-container"></div>
</div>

<script>
    var graph = {{ graphJSON | safe }};
    Plotly.newPlot('chart', graph.data, graph.layout);
</script>
{% endblock %}
