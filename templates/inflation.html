{% extends "base.html" %}

{% block title %}Inflation Rate - StatHub{% endblock %}

{% block content %}
<div class="hero">
    <h1>Global Inflation</h1>
    <p>Annual consumer price inflation (%).</p>
</div>

<div class="card">
    <div id="chart" class="chart-container"></div>
</div>

<script>
    var graph = {{ graphJSON | safe }};
    Plotly.newPlot('chart', graph.data, graph.layout);
</script>
{% endblock %}
