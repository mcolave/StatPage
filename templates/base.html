<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Global Stats Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>

<body>
    <nav class="navbar">
        <a href="/" class="brand">Stat<span style="color: #fff;">Hub</span></a>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/gdp">GDP</a>
            <a href="/population">Population</a>
            <a href="/covid">Covid-19</a>
            <a href="/co2">CO2</a>
            <a href="/life-expectancy">Life Exp.</a>
            <a href="/inflation">Inflation</a>
            <a href="/internet">Internet</a>
            <a href="/forest">Forest</a>
            <a href="/literacy">Literacy</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget-btn" onclick="toggleChat()">💬</div>

    <div id="chat-window" class="chat-window">
        <div class="chat-header">
            <span>Data Assistant</span>
            <span style="cursor:pointer" onclick="toggleChat()">✕</span>
        </div>
        <div id="chat-body" class="chat-body">
            <div class="message bot">Hi! Ask me about global stats.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Ask 'Top 5 GDP'..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 StatHub. Built with Flask & Plotly.</p>
    </footer>

    <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>

</html>
