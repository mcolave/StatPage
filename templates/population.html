{% extends "base.html" %}

{% block title %}Population Stats - StatHub{% endblock %}

{% block content %}
<div class="hero">
    <h1>World Demographics</h1>
    <p>Distribution of the world's most populous nations.</p>
</div>

<div class="card">
    <div id="chart" class="chart-container"></div>
</div>

<script>
    var graph = {{ graphJSON | safe }};
    Plotly.newPlot('chart', graph.data, graph.layout);
</script>
{% endblock %}
