{% extends "base.html" %}

{% block title %}Covid-19 Stats - StatHub{% endblock %}

{% block content %}
<div class="hero">
    <h1>Pandemic Timeline</h1>
    <p>Global case trends over the last 5 years.</p>
</div>

<div class="card">
    <div id="chart" class="chart-container"></div>
</div>

<script>
    var graph = {{ graphJSON | safe }};
    Plotly.newPlot('chart', graph.data, graph.layout);
</script>
{% endblock %}
